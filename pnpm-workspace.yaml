packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  # Родной модуль tdl: его install собирает (а чаще берёт готовым) адаптер к libtdjson.
  # Без разрешения pnpm скрипт молча пропустит, и аккаунт компании упадёт при первом
  # запуске на «не найден адаптер», а выглядеть это будет как поломка кода.
  tdl: true
  # Проверка версии Node перед установкой. Скрипт безобидный, но пропущенный молча он
  # ничего не проверит — а требование там настоящее: библиотека работает с Node 20+.
  baileys: true
  # Готовит рантайм протобуфа, на котором держится разбор сообщений WhatsApp.
  protobufjs: true
minimumReleaseAgeExclude:
  - pg-boss@12.26.2
